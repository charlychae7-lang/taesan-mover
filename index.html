<style>
/* 레이아웃: 하단 탭 5개의 모바일 앱형. 태산 CI(블루·네이비·옐로)를 그대로 따르고, 제목만 블랙한산스. */
:root{
  --blue:#0E3356; --navy:#082641; --yellow:#D8431A; --sky:#3E7CB1; --hl:#FF8A5C;
  --bg:#F3F6FB; --card:#FFFFFF; --ink:#1E2B44; --sub:#566783; --line:#D5DEEE;
  --soft:#E6EDF5; --on-blue:#FFFFFF; --on-yellow:#FFFFFF; --danger:#C0392B; --danger-l:#FCE9E6; --ok:#1C7C54; --ok-l:#E2F3EA;
  --deep:#0E3356; --stage:#FFFFFF; --grid:#D9E2F2; --shadow:0 2px 10px rgba(8,40,92,.09);
  --f-title:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif; --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#6FA3DC; --navy:#DCE8FB; --yellow:#FF7F50; --sky:#8DB4E0; --hl:#FF8A5C;
  --bg:#0C1626; --card:#13233B; --ink:#E8EEFB; --sub:#9FB0CC; --line:#27395A;
  --soft:#1B3050; --on-blue:#08152B; --on-yellow:#2A0F05; --danger:#FF8F82; --danger-l:#3B1F1D; --ok:#6FD3A1; --ok-l:#163326;
  --deep:#14305A; --stage:#0F1D33; --grid:#1F3354; --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#6FA3DC; --navy:#DCE8FB; --yellow:#FF7F50; --sky:#8DB4E0; --hl:#FF8A5C;
  --bg:#0C1626; --card:#13233B; --ink:#E8EEFB; --sub:#9FB0CC; --line:#27395A;
  --soft:#1B3050; --on-blue:#08152B; --on-yellow:#2A0F05; --danger:#FF8F82; --danger-l:#3B1F1D; --ok:#6FD3A1; --ok-l:#163326;
  --deep:#14305A; --stage:#0F1D33; --grid:#1F3354; --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body);letter-spacing:-.01em;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-chip{flex:none;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px 6px}
.logo-chip img{display:block;height:30px;width:auto}
.brand b{display:block;font:600 21px/1.1 var(--f-title);color:var(--navy);white-space:nowrap}
.brand b span{color:var(--blue)}
.brand small{display:block;font-size:12px;color:var(--sub);letter-spacing:.02em}
main{padding:14px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));outline:none}
h1{font:600 28px/1.25 var(--f-title);color:var(--navy);margin:6px 0 8px;text-wrap:balance}
h2{font:600 21px/1.3 var(--f-title);color:var(--navy);margin:26px 0 10px;text-wrap:balance}
h3{font-size:17px;font-weight:600;margin:0 0 4px}
b,strong{font-weight:600}
p{margin:0 0 10px}
a{color:var(--blue)}
.sub{color:var(--sub);font-size:15px}
.small{font-size:14px;color:var(--sub)}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--blue);color:var(--on-blue);font:600 18px var(--f-body);padding:12px 16px;text-decoration:none;cursor:pointer}
.btn.yellow{background:var(--yellow);color:var(--on-yellow)}
.btn.soft{background:var(--soft);color:var(--blue)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{width:auto;min-height:44px;font-size:16px;padding:8px 16px}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
label{display:block;font-weight:600;margin:16px 0 6px}
input[type=date],input[type=number],input[type=text],select{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:var(--card);color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1 1 30%;margin:0;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;background:var(--card);font-weight:600;cursor:pointer;font-size:16px}
.seg input:checked+label{background:var(--soft);border-color:var(--blue);color:var(--blue)}
.seg input:focus-visible+label{outline:3px solid var(--yellow);outline-offset:2px}
.chk{display:flex;align-items:center;gap:12px;font-weight:600;margin:10px 0;cursor:pointer}
.chk input{width:26px;height:26px;accent-color:var(--blue);flex:none}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--blue);margin-right:6px;white-space:nowrap}
.pill.late{background:var(--danger-l);color:var(--danger)}
.pill.today{background:var(--yellow);color:var(--on-yellow)}
.pill.ts{background:var(--navy);color:var(--bg)}
.pill.gov{background:var(--ok-l);color:var(--ok)}
.err{color:var(--danger);font-weight:600;margin:8px 0 0}
.note{font-size:13.5px;color:var(--sub);line-height:1.55;margin-top:14px}

/* 첫 화면 */
.hello{background:var(--blue);color:var(--on-blue);border-radius:18px;padding:20px;margin:4px 0 14px;position:relative;overflow:hidden}
.hello h1{color:inherit;font-size:27px;margin:0 0 6px}
.hello p{margin:0;opacity:.95}
.hello .mark{position:absolute;right:14px;top:14px;background:#fff;border-radius:14px;padding:6px 8px;display:grid;place-items:center}
.hello .mark img{display:block;height:44px;width:auto}
.hello h1,.hello p{padding-right:84px}
:root[data-theme="dark"] .hello,.hello{color:var(--on-blue)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px;padding:0;list-style:none}
.steps li{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;font-size:13.5px;font-weight:600;color:var(--sub)}
.steps b{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);font-size:14px}

/* 홈 */
.hero{background:var(--deep);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.hero .when{font-size:15px;opacity:.9}
.hero .dd{font:600 54px/1.1 var(--f-title);margin:2px 0}
.hero .dd span{color:var(--hl)}
.hero .msg{font-weight:600;margin:2px 0 12px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hl);border-radius:99px}
.hero small{display:block;margin-top:6px;opacity:.92;font-size:14px}
.phase-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:22px 0 8px}
.phase-head h2{margin:0}

/* 일정 */
.ph{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.ph>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.ph>summary::-webkit-details-marker{display:none}
.ph>summary h3{font:600 19px/1.3 var(--f-title);color:var(--navy);margin:0}
.ph>summary .rng{display:block;font-size:13.5px;color:var(--sub);margin-top:1px}
.ph>summary .cnt{flex:none;font-weight:600;font-size:14px;background:var(--soft);color:var(--blue);border-radius:99px;padding:2px 12px}
.ph>summary .cnt.full{background:var(--ok);color:var(--bg)}
.ph .body{padding:0 16px 6px}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.card>.task:first-child{border-top:0}
.task input{width:28px;height:28px;accent-color:var(--blue);flex:none;margin-top:1px}
.task .t{display:block;margin:0;font-weight:600;line-height:1.4}
.task .meta{margin:3px 0 2px;line-height:1.9}
.task .d{font-size:15px;color:var(--sub);line-height:1.55;margin:0}
.task .tip{font-size:14.5px;background:var(--soft);border-radius:8px;padding:8px 10px;margin:8px 0 0;line-height:1.5}
.task .go{display:inline-block;margin-top:6px;font-weight:600;font-size:15px}
.task.done .t{text-decoration:line-through;color:var(--sub);font-weight:500}
.empty{text-align:center;color:var(--sub);padding:18px 0;margin:0}

/* 배치도 */
.stage-wrap{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px;margin-bottom:12px}
.stage{position:relative;width:100%;background:var(--stage);border:2px solid var(--blue);border-radius:6px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--g) var(--g)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.it{position:absolute;display:grid;place-items:center;text-align:center;overflow:hidden;border:2px solid var(--navy);border-radius:4px;background:rgba(61,123,217,.55);color:#08152B;font-size:11.5px;font-weight:600;line-height:1.15;cursor:grab;touch-action:none;padding:1px}
:root[data-theme="dark"] .it{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .it{color:#fff}}
.it:active{cursor:grabbing}
.it.sel{border:3px solid var(--yellow);box-shadow:0 0 0 2px var(--navy);z-index:5}
.it.c1{background:rgba(255,196,0,.6)}.it.c2{background:rgba(46,160,110,.55)}.it.c3{background:rgba(214,92,92,.5)}.it.c4{background:rgba(155,110,210,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 15px var(--f-body);cursor:pointer;min-height:44px}
.chipb small{color:var(--sub);font-weight:500;margin-left:4px}
.chipb:active{background:var(--soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.upl{display:block;text-align:center;padding:16px;border:2px dashed var(--blue);border-radius:12px;color:var(--blue);font-weight:600;cursor:pointer;background:var(--soft);margin:0}
#file:focus-visible+.upl{outline:3px solid var(--yellow);outline-offset:2px}
.selbox{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px}
.selbox .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.guide{margin:0;padding-left:0;list-style:none;counter-reset:g}
.guide li{position:relative;padding:0 0 12px 38px;counter-increment:g}
.guide li::before{content:counter(g);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);font-weight:600;font-size:14px;text-align:center;line-height:28px}

/* 도구 */
.line-item{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line-item:first-child{border-top:0}
.line-item span{font-weight:600}
.line-item small{display:block;color:var(--sub);font-weight:400;font-size:13.5px}
.total{background:var(--soft);border-radius:12px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total b{font:600 26px var(--f-title);color:var(--blue)}
.acheck{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.acheck:first-child{border-top:0}
.acheck input{width:26px;height:26px;accent-color:var(--blue);flex:none}
.acheck label{margin:0;font-weight:600}
.acheck .small{margin:2px 0 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv dt{color:var(--sub);font-size:15px}.kv dd{margin:0;font-weight:600}
.tel{font:600 30px/1.2 var(--f-title);color:var(--blue);letter-spacing:.01em;user-select:all}
.ok{background:var(--ok-l);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:600;margin-top:10px}

/* 홈페이지 슬라이드·갤러리 */
.car{position:relative;border-radius:12px;overflow:hidden;background:var(--deep);margin-bottom:12px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.track>.sl{flex:0 0 100%;scroll-snap-align:start;position:relative;display:block}
.track .sl img{width:100%;height:auto;display:block}
.adtag{position:absolute;right:8px;top:8px;z-index:2;font-size:11.5px;font-weight:600;color:#fff;background:rgba(8,38,65,.7);border-radius:6px;padding:0 7px}
.cbtn{position:absolute;top:calc(50% - 22px);width:44px;height:44px;border:0;border-radius:50%;background:rgba(8,38,65,.62);color:#fff;font:600 28px/1 var(--f-body);cursor:pointer}
.cbtn.prev{left:8px}.cbtn.next{right:8px}
.dots{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center}
.dots button{width:30px;height:30px;border:0;background:transparent;cursor:pointer;position:relative}
.dots button::after{content:"";position:absolute;left:10px;top:10px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55)}
.dots button[aria-current]::after{background:var(--hl)}
.pnl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pnl a{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.pnl a.p1{grid-column:1/-1}
.pnl img,.gal img{display:block;width:100%;height:auto}
.notice{margin:6px 0 12px;padding-left:18px}.notice li{margin:4px 0}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal a{display:block;border-radius:10px;overflow:hidden;background:var(--line)}

/* 하단 홍보 배너 */
.bn{display:block;margin:22px 0 4px;border-radius:16px;background:var(--deep);color:#fff;text-decoration:none;padding:16px;position:relative;overflow:hidden}
.bn .ad{position:absolute;right:12px;top:10px;font-size:11.5px;font-weight:600;color:#fff;opacity:.85;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:0 6px}
.bn .top2{display:flex;align-items:center;gap:12px}
.bn .chip{flex:none;background:#fff;border-radius:10px;padding:5px 8px;display:grid;place-items:center}
.bn .chip img{display:block;height:34px;width:auto}
.bn .t1{font:600 20px/1.25 var(--f-title);margin:0}
.bn .t2{font-size:14.5px;margin:10px 0 0;opacity:.95;line-height:1.5}
.bn .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.bn .num{font:600 26px/1.2 var(--f-title);color:var(--hl)}
.bn .go{display:inline-block;background:var(--yellow);color:var(--on-yellow);font-weight:600;border-radius:10px;padding:10px 16px}
.bn:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
.bn img.full{display:block;width:100%;height:auto;margin:-16px;width:calc(100% + 32px);max-width:none}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;max-width:520px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs a{flex:1;text-align:center;padding:8px 0 9px;text-decoration:none;color:var(--sub);font-size:13px;font-weight:600;min-height:56px}
.tabs a svg{display:block;margin:0 auto 2px}
.tabs a.on{color:var(--blue)}
.tabs a.on svg{stroke:var(--blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

function today0(){var d=new Date();d.setHours(0,0,0,0);return d}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diff(a,b){return Math.round((a-b)/DAY)}
function fmt(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일('+'일월화수목금토'[d.getDay()]+')'}
function short(d){return (d.getMonth()+1)+'/'+d.getDate()+'('+'일월화수목금토'[d.getDay()]+')'}
function dl(off){return off===0?'이사 당일':off<0?'D-'+(-off):'D+'+off}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function md(){return S.date?parse(S.date):null}

function active(){
  return T.filter(function(t){
    if(!t.when) return true;
    if(t.when==='rent') return S.tenure!=='own';
    if(t.when==='own') return S.tenure==='own';
    if(t.when==='kids') return S.kids;
    if(t.when==='car') return S.car;
    if(t.when==='pet') return S.pet;
    if(t.when==='self') return S.pack!=='full';
    return true;
  }).map(function(t){
    var due=new Date(md().getTime()+t.off*DAY);
    return Object.assign({},t,{due:due,left:diff(due,today0())});
  });
}

function copyText(txt,msgEl){
  function fb(){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    msgEl.textContent=ok?'복사했어요.':'복사가 막혀 있어요. 아래 내용을 길게 눌러 직접 복사해 주세요.';
  }
  try{navigator.clipboard.writeText(txt).then(function(){msgEl.textContent='복사했어요.'},fb)}catch(e){fb()}
}

function homeV(){

function taskRow(t,compact){
  var tag;
  if(S.done[t.id]) tag='';
  else if(t.left<0) tag='<span class="pill late">'+(t.off<0?'기한이 지났어요':'지금 해요')+'</span>';
  else if(t.left===0) tag='<span class="pill today">오늘</span>';
  else tag='';
  var dpill='<span class="pill">'+dl(t.off)+' · '+short(t.due)+'</span>';
  var who=WHO[t.who]?'<span class="pill '+t.who+'">'+WHO[t.who]+'</span>':'';
  return '<div class="task'+(S.done[t.id]?' done':'')+'">'+
   '<input type="checkbox" id="k-'+t.id+'" data-id="'+t.id+'"'+(S.done[t.id]?' checked':'')+' aria-label="'+esc(t.t)+'">'+
   '<div style="min-width:0;flex:1"><label for="k-'+t.id+'" class="t">'+esc(t.t)+'</label>'+
   '<div class="meta">'+tag+dpill+who+'</div>'+
   (compact?'':'<p class="d">'+esc(t.d)+'</p>')+
   (!compact&&t.tip?'<p class="tip">'+esc(t.tip)+'</p>':'')+
   (!compact&&t.go?'<a class="go" href="#'+t.go[0]+'">'+esc(t.go[1])+' ›</a>':'')+
   '</div></div>';
}
function planV(){
  var tasks=active().sort(function(a,b){return a.due-b.due});
  var shown=tasks.filter(function(t){return filter==='all'||(filter==='todo'?!S.done[t.id]:!!S.done[t.id])});
  if(openPh===null){
    var nx=tasks.filter(function(t){return !S.done[t.id]&&t.left>=0}).sort(function(a,b){return a.due-b.due})[0];
    openPh={}; openPh[(nx||tasks[tasks.length-1]).ph]=true;
  }
  var groups=PH.map(function(p,i){return {i:i,p:p,list:shown.filter(function(t){return t.ph===i}),all:tasks.filter(function(t){return t.ph===i})}}).filter(function(g){return g.list.length});
  var f=function(v,l){return '<input type="radio" name="flt" id="f-'+v+'" value="'+v+'"'+(filter===v?' checked':'')+'><label for="f-'+v+'">'+l+'</label>'};

  '<div class="seg" role="radiogroup" aria-label="보기" style="margin:8px 0 14px">'+f('all','전체')+f('todo','남은 일')+f('done','끝낸 일')+'</div>'+
  (groups.length?groups.map(function(g){
    var dn=g.all.filter(function(t){return S.done[t.id]}).length, a=g.all[0].due, b=g.all[g.all.length-1].due;
    var rng=a.getTime()===b.getTime()?fmt(a):short(a)+' ~ '+short(b);
    return '<details class="ph" data-ph="'+g.i+'"'+(openPh[g.i]||filter!=='all'?' open':'')+'><summary><div><h3>'+g.p.n+'</h3><span class="rng">'+g.p.r+' · '+rng+'</span></div><span class="cnt'+(dn===g.all.length?' full':'')+'">'+dn+'/'+g.all.length+'</span></summary><div class="body">'+g.list.map(function(t){return taskRow(t)}).join('')+'</div></details>';
  }).join(''):'<div class="card"><p class="empty">'+(filter==='done'?'아직 끝낸 일이 없어요.':'남은 일이 없어요.')+'</p></div>')+
  '<div class="card"><h3>일정 복사하기</h3><p class="small">내 일정을 문자나 메모에 붙여 넣어 두고 싶을 때 써요.</p><button class="btn soft" id="copyPlan" type="button">전체 일정 복사</button><p id="copyMsg" class="small" role="status" style="margin:8px 0 0"></p></div>'+
  disc();
}

function saveLay(){save()}
function stageEl(){return $('#stage')}
function sizeStage(){
  var st=stageEl(); if(!st) return;
  var L=S.lay, wcm=L.w*100;
  var w=st.clientWidth||st.parentNode.clientWidth-24; scale=w/wcm;
  if(img){ st.style.height=(w*img.h/img.w)+'px'; st.classList.remove('grid'); $('#dBox').hidden=true; }
  else { st.style.height=(w*L.d/L.w)+'px'; st.classList.add('grid'); st.style.setProperty('--g',(50*scale)+'px'); $('#dBox').hidden=false; }
  $('#wHint').textContent=img?('도면 가로 '+L.w+'m 기준으로 가구가 그려져요.'):('빈 방 '+L.w+'m × '+L.d+'m (칸 하나가 50cm)');
}
function dims(it){return it.r?[it.h,it.w]:[it.w,it.h]}
function drawItems(){
  var st=stageEl(); if(!st) return;
  Array.prototype.slice.call(st.querySelectorAll('.it')).forEach(function(n){n.remove()});
  S.lay.items.forEach(function(it){
    var d=dims(it), el=document.createElement('div');
    el.className='it c'+(it.c||0)+(sel===it.id?' sel':'');
    el.dataset.id=it.id;
    el.style.left=(it.x*scale)+'px';el.style.top=(it.y*scale)+'px';
    el.style.width=(d[0]*scale)+'px';el.style.height=(d[1]*scale)+'px';
    el.textContent=it.n;
    el.setAttribute('role','button');el.setAttribute('aria-label',it.n+' '+it.w+'×'+it.h+'cm');
    st.appendChild(el);
  });
  drawSel();
}
function drawSel(){
  var box=$('#selBox'); if(!box) return;
  var it=S.lay.items.filter(function(x){return x.id===sel})[0];
  if(!it){box.innerHTML='<p class="small" style="margin:10px 4px 2px">가구를 누르면 크기 바꾸기, 돌리기, 지우기가 나와요. 끌어서 옮겨요.</p>';return}
  box.innerHTML='<div class="selbox"><b>'+esc(it.n)+'</b> <span class="small">(가로 '+it.w+'cm × 세로 '+it.h+'cm)</span>'+
   '<div class="row2" style="margin-top:8px"><div><label for="sw" style="margin:0 0 4px;font-size:14px">가로 cm</label><input type="number" id="sw" inputmode="numeric" min="10" max="600" value="'+it.w+'"></div><div><label for="sh" style="margin:0 0 4px;font-size:14px">세로 cm</label><input type="number" id="sh" inputmode="numeric" min="10" max="600" value="'+it.h+'"></div></div>'+
   '<div class="acts"><button class="btn sm soft" type="button" id="rot">돌리기</button><button class="btn sm soft" type="button" id="dup">복제</button><button class="btn sm line" type="button" id="del">지우기</button></div></div>';
  $('#sw').onchange=function(){it.w=clampN(this.value,10,600,it.w);fit(it);saveLay();drawItems()};
  $('#sh').onchange=function(){it.h=clampN(this.value,10,600,it.h);fit(it);saveLay();drawItems()};
  $('#rot').onclick=function(){it.r=it.r?0:1;fit(it);saveLay();drawItems()};
  $('#dup').onclick=function(){var c=Object.assign({},it,{id:uid(),x:it.x+30,y:it.y+30});S.lay.items.push(c);fit(c);sel=c.id;saveLay();drawItems()};
  $('#del').onclick=function(){S.lay.items=S.lay.items.filter(function(x){return x.id!==it.id});sel=null;saveLay();drawItems()};
}
function clampN(v,a,b,def){var n=Number(v);if(!isFinite(n)||n<a)return def;return Math.min(b,Math.round(n))}
function uid(){return 'i'+Math.random().toString(36).slice(2,9)}
function bounds(){var st=stageEl();return [st.clientWidth/scale,st.clientHeight/scale]}
function fit(it){var b=bounds(),d=dims(it);it.x=Math.max(0,Math.min(it.x,b[0]-d[0]));it.y=Math.max(0,Math.min(it.y,b[1]-d[1]))}
function addItem(n,w,h,c){
  var b=bounds(), it={id:uid(),n:n,w:w,h:h,r:0,c:c||0,x:0,y:0};
  var k=S.lay.items.length%6;
  it.x=b[0]/2-w/2+k*20; it.y=b[1]/2-h/2+k*20; fit(it);
  S.lay.items.push(it); sel=it.id; saveLay(); drawItems();
}
function bindLayout(){
  var st=stageEl(), L=S.lay;
  $('#file').onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var msg=$('#imgMsg');
    if(!/^image\//.test(f.type)){msg.textContent='사진 파일을 골라 주세요.';return}
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        img={src:rd.result,w:im.naturalWidth,h:im.naturalHeight};
        var old=st.querySelector('img'); if(old) old.remove();
        var el=document.createElement('img'); el.src=img.src; el.alt='새 집 도면'; st.insertBefore(el,st.firstChild);
        msg.textContent='도면을 올렸어요. 위 칸에 도면 가로의 실제 길이(m)를 넣어 주세요.'; sizeStage(); drawItems();
      };
      im.onerror=function(){msg.textContent='이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'};
      im.src=rd.result;
    };
    rd.onerror=function(){msg.textContent='사진을 읽지 못했어요. 다시 시도해 주세요.'};
    rd.readAsDataURL(f);
  };
  $('#wM').onchange=function(){L.w=clampN(this.value*10,10,400,L.w*10)/10;this.value=L.w;save();sizeStage();S.lay.items.forEach(fit);drawItems()};
  $('#dM').onchange=function(){L.d=clampN(this.value*10,10,400,L.d*10)/10;this.value=L.d;save();sizeStage();S.lay.items.forEach(fit);drawItems()};
  Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(b){b.onclick=function(){var p=PRESET[b.dataset.p];addItem(p[0],p[1],p[2],p[3])}});
  $('#cadd').onclick=function(){
    var n=$('#cn').value.trim()||'가구', w=clampN($('#cw').value,10,600,0), h=clampN($('#ch').value,10,600,0);
    if(!w||!h){$('#layMsg').textContent='가로와 세로를 cm 단위로 넣어 주세요. 예: 가로 120, 세로 60';return}
    $('#layMsg').textContent=''; addItem(n,w,h,4); $('#cn').value='';$('#cw').value='';$('#ch').value='';
  };
  $('#copyLay').onclick=function(){
    var its=S.lay.items; if(!its.length){$('#layMsg').textContent='아직 놓은 가구가 없어요.';return}
    var lines=['[가구 배치 목록] 기준: 가로 '+L.w+'m']; its.forEach(function(it){lines.push('- '+it.n+' '+it.w+'×'+it.h+'cm'+(it.r?' (돌림)':'')+' / 왼쪽에서 '+Math.round(it.x)+'cm, 위에서 '+Math.round(it.y)+'cm')});
    copyText(lines.join('\n'),$('#layMsg'));
  };
  var armed=false;
  $('#clearLay').onclick=function(){
    if(!armed){armed=true;this.textContent='정말 지울까요? 한 번 더 누르면 지워져요';return}
    S.lay.items=[];sel=null;save();drawItems();armed=false;this.textContent='모든 가구 지우기';
  };
  /* 끌어서 옮기기 */
  var drag=null;
  st.addEventListener('pointerdown',function(e){
    var n=e.target.closest('.it');
    if(!n){sel=null;drawItems();return}
    var it=S.lay.items.filter(function(x){return x.id===n.dataset.id})[0]; if(!it) return;
    e.preventDefault();
    var r=st.getBoundingClientRect();
    drag={it:it,n:n,ox:(e.clientX-r.left)/scale-it.x,oy:(e.clientY-r.top)/scale-it.y,moved:false,id:e.pointerId};
    try{n.setPointerCapture(e.pointerId)}catch(x){}
    if(sel!==it.id){sel=it.id;Array.prototype.forEach.call(st.querySelectorAll('.it'),function(q){q.classList.toggle('sel',q.dataset.id===sel)});drawSel()}
  });
  st.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id) return;
    var r=st.getBoundingClientRect(), it=drag.it;
    it.x=(e.clientX-r.left)/scale-drag.ox; it.y=(e.clientY-r.top)/scale-drag.oy; fit(it); drag.moved=true;
    drag.n.style.left=(it.x*scale)+'px'; drag.n.style.top=(it.y*scale)+'px';
  });
  function end(e){if(!drag||(e&&e.pointerId!==drag.id)) return; if(drag.moved) saveLay(); drag=null}
  st.addEventListener('pointerup',end); st.addEventListener('pointercancel',end);
  sizeStage();
  if(img){var el=document.createElement('img');el.src=img.src;el.alt='새 집 도면';st.insertBefore(el,st.firstChild);sizeStage()}
  drawItems();
}

function bindCar(id,auto){
  var root=document.getElementById(id); if(!root) return;
  var tr=root.querySelector('.track'), n=tr.children.length;
  var dots=Array.prototype.slice.call(root.querySelectorAll('.dots button'));
  function cur(){return Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth))}
  function go(i){if(i<0)i=n-1;if(i>=n)i=0;tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'})}
  tr.addEventListener('scroll',function(){var c=cur();dots.forEach(function(d,i){if(i===c)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current')})});
  var pv=root.querySelector('.prev'), nx=root.querySelector('.next');
  if(pv) pv.onclick=function(){go(cur()-1)}; if(nx) nx.onclick=function(){go(cur()+1)};
  dots.forEach(function(d){d.onclick=function(){go(Number(d.dataset.d))}});
  tr.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault()}if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault()}});
  if(!auto||n<2) return;
  var calm=false; try{calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  if(calm) return;
  var paused=false;
  ['pointerdown','mouseenter','focusin'].forEach(function(ev){root.addEventListener(ev,function(){paused=true})});
  ['pointerup','mouseleave','focusout'].forEach(function(ev){root.addEventListener(ev,function(){setTimeout(function(){paused=false},2500)})});
  window.__carT=setInterval(function(){if(!paused&&!document.hidden)go(cur()+1)},5000);
}

function bind(r){
  if(r==='setup'){
    $('#start').onclick=function(){
      var v=$('#date').value; if(!v){$('#dateErr').hidden=false;$('#date').focus();return}
      S.date=v;
      S.tenure=(document.querySelector('input[name=tenure]:checked')||{}).value||'rent';
      S.pack=(document.querySelector('input[name=pack]:checked')||{}).value||'full';
      S.kids=$('#kids').checked;S.car=$('#car').checked;S.pet=$('#pet').checked;
      save(); location.hash='#home'; render();
    };
  }
  if(r==='home'||r==='plan') {
    Array.prototype.forEach.call(document.querySelectorAll('input[data-id]'),function(c){c.onchange=function(){S.done[c.dataset.id]=c.checked;save();render(true)}});
  }
  if(r==='plan'){
    Array.prototype.forEach.call(document.querySelectorAll('input[name=flt]'),function(x){x.onchange=function(){filter=x.value;render(true)}});
    Array.prototype.forEach.call(document.querySelectorAll('details.ph'),function(d){d.addEventListener('toggle',function(){openPh=openPh||{};openPh[d.dataset.ph]=d.open})});
    $('#copyPlan').onclick=function(){
      var lines=['[내 이사 일정] 이사일 '+fmt(md())];
      active().sort(function(a,b){return a.due-b.due}).forEach(function(t){lines.push((S.done[t.id]?'[완료] ':'[ ] ')+short(t.due)+' '+dl(t.off)+' '+t.t)});
      copyText(lines.join('\n'),$('#copyMsg'));
    };
  }
  if(r==='layout') bindLayout();
  if(r==='tools'){
    Array.prototype.forEach.call(document.querySelectorAll('input[data-b]'),function(i){i.oninput=function(){
      S.budget[i.dataset.b]=i.value;save();var t=0;BUD.forEach(function(b){t+=Number(S.budget[b[0]]||0)});$('#btot').textContent=man(t)+'만원'}});
    Array.prototype.forEach.call(document.querySelectorAll('input[data-a]'),function(c){c.onchange=function(){S.addr[c.dataset.a]=c.checked;save();render(true)}});
  }
  if(r==='taesan'){
    $('#copyTel').onclick=function(){copyText(TEL,$('#telMsg'))};
    bindCar('car',false);
    $('#copyMemo').onclick=function(){
      var kind={full:'포장이사',half:'반포장이사',basic:'일반이사'}[S.pack];
      var t=['[이사 상담 메모]','이사 예정일: '+(S.date?fmt(md()):'미정'),'이사 방식: '+kind,'집: '+(S.tenure==='own'?'자가':'전·월세'),'특이사항: '+[S.kids?'자녀 있음':'',S.car?'자동차 있음':'',S.pet?'반려동물 있음':''].filter(Boolean).join(', '),'지금 집 주소/층/엘리베이터: ','새 집 주소/층/엘리베이터/주차: ','큰 가구·가전/특별한 짐: '];
      copyText(t.join('\n'),$('#memoMsg'));
    };
